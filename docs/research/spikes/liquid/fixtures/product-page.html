<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spike</title>
    

<link href="/assets/ripple.css" rel="stylesheet" type="text/css" media="all" />
<style data-shopify>
  :root {
    --rp-radius-dial: 1;
  }
</style>
<script type="importmap">
  {
    "imports": {
      "ripple": "/assets/ripple.js"
    }
  }
</script>
<script src="/assets/ripple.js" type="module"></script>

    
  </head>
  <body>
    <header>
      <a href="/cart">
        Cart
        
          <rp-cart-count data-count="0">0</rp-cart-count>
        
      </a>
    </header>
    <main>
      

<section
  class="rp-stack "
  
  data-gap="4 md:8"
  
  
  
  
  data-py="6"
  
>
  
  <h1>Tee &amp; &lt;b&gt;Co&lt;/b&gt;</h1>

  
  
    <p>$25.00</p>
    
      

<span class="rp-badge " data-tone="success">In stock</span>




    

    <rp-product-form
  class="rp-product-form "
  data-product-id="gid://shopify/Product/7"
  
>
  <form method="post" action="/cart/add" id="rp-product-form-7" accept-charset="UTF-8" class="rp-product-form-fields" enctype="multipart/form-data"><input type="hidden" name="form_type" value="product" /><input type="hidden" name="utf8" value="✓" />
    <input type="hidden" name="id" value="42" data-rp-field="merchandise-id">
    
      <div
  class="rp-stack "
  
  data-gap="3"
  
  
  
  
  
  
>
  
        <label for="rp-quantity">Quantity</label>
        <input id="rp-quantity" class="rp-input" type="number" name="quantity" value="1" min="1" inputmode="numeric">
        

<button
    class="rp-button "
    
    type="submit"
    name="add"
    
    
    data-variant="primary"
    data-size="lg"
    data-full-width
    
    
  >
          
            Add to cart
          
        </button>



      
</div>



    
    <p class="rp-form-message" data-rp-part="error" data-tone="critical" role="alert" hidden></p>
    
      <div class="rp-product-form-accelerated"><div data-shopify="payment-button" class="shopify-payment-button"></div></div>
    
  <input type="hidden" name="product-id" value="7" /></form>
</rp-product-form>



  

  

<ui-dialog id="size-guide" class="rp-dialog ">
  
    <ui-dialog-trigger><button
    class="rp-button "
    id="size-guide-trigger"
    type="button"
    
    
    
    data-variant="link"
    data-size="md"
    
    
    aria-haspopup="dialog" data-closed data-slot="dialog-trigger"
  >Size guide</button></ui-dialog-trigger>



    <ui-dialog-backdrop class="rp-dialog-backdrop" hidden data-slot="dialog-backdrop"></ui-dialog-backdrop>
<ui-dialog-content class="rp-dialog-content " hidden data-slot="dialog-content">
  
      

<ui-dialog-title
  class="rp-dialog-title "
  id="size-guide-title"
  role="heading"
  aria-level="2"
  data-slot="dialog-title"
>Size guide</ui-dialog-title>



      <p>S, M, L.</p>
    
  <ui-dialog-close><button
    class="rp-button rp-dialog-close"
    
    type="button"
    
    
    
    data-variant="ghost"
    data-size="sm"
    
    
    data-slot="dialog-close"
  >Close</button></ui-dialog-close>
</ui-dialog-content>



  
</ui-dialog>




  <div
  class="rp-accordion "
  
  data-variant="bordered"
>
  
    

<details
  class="rp-accordion-item "
  
  name="product-details"
  open
>
  
      

<summary class="rp-accordion-summary ">Shipping and returns</summary>



      

<div class="rp-accordion-panel ">
  <p>Ships in 2 days.</p>
</div>



    
</details>



    

<details
  class="rp-accordion-item "
  
  name="product-details"
  
>
  
      

<summary class="rp-accordion-summary ">Materials</summary>



      

<div class="rp-accordion-panel ">
  <p>100% cotton.</p>
</div>



    
</details>



  
</div>




</section>




    </main>
  </body>
</html>
