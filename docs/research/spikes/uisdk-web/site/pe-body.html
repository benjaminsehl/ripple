<section id="c-forms">
  <form id="f-checkbox" action="/submit" method="get">
    <label><ui-checkbox name="terms" value="yes" default-checked></ui-checkbox> terms</label>
    <label><input type="checkbox" name="native" value="yes" checked> native</label>
    <button type="submit">Go</button>
  </form>
  <form id="f-select" action="/submit" method="get">
    <ui-select name="role" default-value="editor">
      <ui-select-trigger><button type="button" aria-label="Role"><ui-select-value></ui-select-value></button></ui-select-trigger>
      <ui-select-content hidden><ui-select-item value="viewer">Viewer</ui-select-item><ui-select-item value="editor">Editor</ui-select-item></ui-select-content>
    </ui-select>
    <select name="nativerole"><option value="viewer">Viewer</option><option value="editor" selected>Editor</option></select>
    <button type="submit">Go</button>
  </form>
  <form id="f-number-host" action="/submit" method="get">
    <ui-number-input name="quantity" default-value="2" min="1">
      <ui-number-input-group>
        <ui-number-input-decrement><button type="button" aria-label="Decrease">-</button></ui-number-input-decrement>
        <ui-number-input-control><input aria-label="Quantity" /></ui-number-input-control>
        <ui-number-input-increment><button type="button" aria-label="Increase">+</button></ui-number-input-increment>
      </ui-number-input-group>
    </ui-number-input>
    <button type="submit">Go</button>
  </form>
  <form id="f-number-native" action="/submit" method="get">
    <ui-number-input default-value="2" min="1">
      <ui-number-input-group>
        <ui-number-input-decrement><button type="button" aria-label="Decrease">-</button></ui-number-input-decrement>
        <ui-number-input-control><input type="number" name="quantity" value="2" min="1" aria-label="Quantity" /></ui-number-input-control>
        <ui-number-input-increment><button type="button" aria-label="Increase">+</button></ui-number-input-increment>
      </ui-number-input-group>
    </ui-number-input>
    <button type="submit">Go</button>
  </form>
  <form id="f-number-both" action="/submit" method="get">
    <ui-number-input name="quantity" default-value="2" min="1">
      <ui-number-input-group>
        <ui-number-input-control><input type="number" name="quantity" value="2" min="1" aria-label="Quantity" /></ui-number-input-control>
        <ui-number-input-increment><button type="button" aria-label="Increase">+</button></ui-number-input-increment>
      </ui-number-input-group>
    </ui-number-input>
    <button type="submit">Go</button>
  </form>
  <form id="f-field-native" action="/submit" method="get">
    <ui-field id="fn">
      <ui-field-label>Email</ui-field-label>
      <input type="email" name="email" value="a@b.co" required />
      <ui-field-description>We never share it.</ui-field-description>
      <ui-field-error></ui-field-error>
    </ui-field>
    <ui-field id="fs">
      <ui-field-label>Country</ui-field-label>
      <select name="country"><option value="ca" selected>Canada</option><option value="us">US</option></select>
    </ui-field>
    <button type="submit">Go</button>
  </form>
  <form id="f-button" action="/submit" method="get">
    <input type="hidden" name="id" value="42">
    <ui-button><button type="submit" name="add" value="1">Add to cart</button></ui-button>
  </form>
</section>
